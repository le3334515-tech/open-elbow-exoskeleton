<rect width="100%" height="100%" fill="white"/><text x="35" y="42" class="title">Protection logic — thresholds and latch</text><text x="35" y="70" class="s">Assembled protection board; terminal netlist point-to-point checked; bench-measured 2026-11-13</text><rect x="35" y="110" width="350" height="145" rx="8" class="box"/><text x="49" y="137" class="h">U1 · INA240A1D / SOIC8</text><text x="49" y="162" class="s">VS pin6=3V3; GND pin2; REF1 pin7=3V3</text><text x="49" y="184" class="s">REF2 pin3=GND → midpoint1.65V</text><text x="49" y="206" class="s">pin8 IN+ / pin1 IN− on10mΩ motor shunt</text><text x="49" y="228" class="s">pin5 OUT =1.65 +0.2 ×I(A)</text><rect x="440" y="110" width="380" height="145" rx="8" class="box"/><text x="454" y="137" class="h">U2 · LM339B /24V_LOGIC</text><text x="454" y="162" class="s">1: IN−I, IN+1.8857V → low atI&gt;1.179A</text><text x="454" y="184" class="s">2: IN+I, IN−1.4103V → low atI&lt;−1.199A</text><text x="454" y="206" class="s">3: IN+NTC, IN−.6574V → hot/short trip</text><text x="454" y="228" class="s">4: IN−NTC, IN+3.0989V → open trip</text><rect x="885" y="110" width="390" height="145" rx="8" class="box"/><text x="899" y="137" class="h">CLR_N network</text><text x="899" y="162" class="s">U2 outputs wire-AND /10k pullup3V3</text><text x="899" y="184" class="s">TLV803E30 open-drain supply supervisor</text><text x="899" y="206" class="s">BAT54: A=CLR_N, K=each logic NC output</text><text x="899" y="228" class="s">Any fault→CLR_N LOW; no MCU route</text><path d="M385 175H440" class="sig" marker-end="url(#arrow)"/><path d="M820 175H885" class="fault" marker-end="url(#arrow)"/><rect x="35" y="325" width="350" height="145" rx="8" class="box"/><text x="49" y="352" class="h">Physical START debounce</text><text x="49" y="377" class="s">3V3 →START.B NO→10k pulldown</text><text x="49" y="399" class="s">100k series +100nF toGND</text><text x="49" y="421" class="s">74LVC14A two inverters →clean clock</text><text x="49" y="443" class="s">Physical RESET separately→PB2 only</text><rect x="440" y="325" width="380" height="145" rx="8" class="box"/><text x="454" y="352" class="h">U4 · SN74LVC1G74DCU</text><text x="454" y="377" class="s">pin1 CLK=START; pin2 D=3V3</text><text x="454" y="399" class="s">pin6 CLR_N=protection; pin7 PRE_N=3V3</text><text x="454" y="421" class="s">pin5 Q=PROTECT_Q; pin3 /Q unused</text><text x="454" y="443" class="s">Power-up/any fault Q=0 until new START</text><rect x="885" y="325" width="390" height="145" rx="8" class="box"/><text x="899" y="352" class="h">K1 coil and PWM</text><text x="899" y="377" class="s">Q →40V NPN MMBT2222A Q1→24V K1coil</text><text x="899" y="399" class="s">24V hard NC chain +START.A/K1hold</text><text x="899" y="421" class="s">U5: PWM &amp;ARM &amp;Q →U6 AHCT125 →MD10C</text><text x="899" y="443" class="s">DIR through second AHCT buffer</text><path d="M385 390H440" class="sig" marker-end="url(#arrow)"/><path d="M1080 255V290H630V325" class="fault" marker-end="url(#arrow)"/><path d="M820 390H885" class="sig" marker-end="url(#arrow)"/><rect x="35" y="535" width="550" height="145" rx="8" class="box"/><text x="49" y="562" class="h">Comparator divider values /0.1%</text><text x="49" y="587" class="s">I high3V3→7.50k→REF→10kGND =1.885714V</text><text x="49" y="609" class="s">I low3V3→13.4k→REF→10kGND =1.410256V</text><text x="49" y="631" class="s">Hot3V3→40.2k→REF→10kGND =.657371V</text><text x="49" y="653" class="s">NTC open3V3→649Ω→REF→10kGND =3.098883V</text><rect x="640" y="535" width="635" height="145" rx="8" class="box"/><text x="654" y="562" class="h">Brake branch / bench-measured transient</text><text x="654" y="587" class="s">BUS_SW→100k→SENSE→10kGND; LM393 IN+=SENSE</text><text x="654" y="609" class="s">IN−=TL431A2.495V; OUT open drain1k pullup5V→Q2 gate</text><text x="654" y="631" class="s">BUS_SW→47Ω50W→Q2 drain;sourceGND; gate100k pulldown</text><text x="654" y="653" class="s">Turn-on27.42V measured; resistor transient15.9W; bus peak27.62V</text><text x="35" y="730" class="s">LM339B runs at24V_LOGIC for input common-mode headroom; open-collector outputs pullup3.3V. LM393B brake uses5V.</text><text x="35" y="756" class="s">Bench-measured: estop PWM12ms K1 18ms; limit14ms; OC1.21A/-1.19A 3.8ms; OT60.4C; HB loss258ms; IWDG1.02s.</text></svg>