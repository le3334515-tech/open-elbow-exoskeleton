<rect width="100%" height="100%" fill="white"/><text x="35" y="42" class="title">Open Elbow v0.1 — wiring / 电气接线</text><text x="35" y="70" class="s">Design only · 2026-11-13 · No physical circuit assembled / 实体未装配</text><rect x="35" y="105" width="220" height="110" rx="8" class="box"/><text x="49" y="132" class="h">PS1 · 24V 3A</text><text x="49" y="157" class="s">Isolated DC supply</text><text x="49" y="179" class="s">F1 3A motor / F2 .5A logic</text><text x="49" y="201" class="s">GND star return</text><rect x="320" y="105" width="280" height="110" rx="8" class="box"/><text x="334" y="132" class="h">K1 · manual power latch</text><text x="334" y="157" class="s">24V coil + NO hold contact</text><text x="334" y="179" class="s">S0/S1/S2 NC coil chain</text><text x="334" y="201" class="s">START 2NO; PROTECT_Q gate</text><rect x="680" y="105" width="250" height="110" rx="8" class="box"/><text x="694" y="132" class="h">MD10C Rev3</text><text x="694" y="157" class="s">B+ = BUS_SW / B− = GND</text><text x="694" y="179" class="s">PWM 5V / DIR 5V</text><text x="694" y="201" class="s">Nominal 5–30V, 10A</text><rect x="1010" y="105" width="280" height="110" rx="8" class="box"/><text x="1024" y="132" class="h">M1 · Pololu4692</text><text x="1024" y="157" class="s">24V / gearbox30:1</text><text x="1024" y="179" class="s">M+ → 10mΩ shunt → RED</text><text x="1024" y="201" class="s">M− → BLACK; belt3:1</text><path d="M255 150H320" class="power" marker-end="url(#arrow)"/><path d="M600 150H680" class="power" marker-end="url(#arrow)"/><text x="610" y="135" class="s">BUS_SW</text><path d="M930 150H1010" class="power" marker-end="url(#arrow)"/><rect x="35" y="285" width="220" height="140" rx="8" class="box"/><text x="49" y="312" class="h">DC1 / logic</text><text x="49" y="337" class="s">24V before K1 → 5V1A</text><text x="49" y="359" class="s">MCU board → 3V3</text><text x="49" y="381" class="s">ENC motor5V; AS56003V3</text><text x="49" y="403" class="s">Do not backfeed USB5V</text><rect x="320" y="285" width="280" height="180" rx="8" class="box"/><text x="334" y="312" class="h">STM32F407VET6</text><text x="334" y="337" class="s">PA6 PWM / PA7 DIR / PB0 ARM</text><text x="334" y="359" class="s">PB1 E-stop / PB10,11 limits</text><text x="334" y="381" class="s">PB2 manual RESET</text><text x="334" y="403" class="s">PB6/7 I2C; PA1/2/3 ADC</text><text x="334" y="425" class="s">PA0/PB3 motor encoder diag</text><text x="334" y="447" class="s">PA9/10 UART115200</text><rect x="680" y="285" width="250" height="180" rx="8" class="box"/><text x="694" y="312" class="h">Independent protection</text><text x="694" y="337" class="s">INA240 current ±1.2A</text><text x="694" y="359" class="s">NTC case60°C + open wire</text><text x="694" y="381" class="s">LM339B → async CLR</text><text x="694" y="403" class="s">LVC1G74 manual START latch</text><text x="694" y="425" class="s">LVC2G08 two AND stages</text><text x="694" y="447" class="s">AHCT125 3V3 →5V buffer</text><rect x="1010" y="285" width="280" height="180" rx="8" class="box"/><text x="1024" y="312" class="h">Sensors</text><text x="1024" y="337" class="s">AS5600 I2C0x36 + magnet</text><text x="1024" y="359" class="s">INA240 .2V/A midpoint1.65V</text><text x="1024" y="381" class="s">NTC10kB3950 / pullup10k</text><text x="1024" y="403" class="s">Vbus divider100k/10k</text><text x="1024" y="425" class="s">Motor encoder5V</text><text x="1024" y="447" class="s">A/B divide10k/20k to3V3</text><path d="M145 215V285" class="power" marker-end="url(#arrow)"/><path d="M255 335H320" class="power" marker-end="url(#arrow)"/><path d="M600 330H680" class="sig" marker-end="url(#arrow)"/><text x="605" y="316" class="s">PWM/DIR</text><path d="M805 285V215" class="sig" marker-end="url(#arrow)"/><path d="M1010 370H930" class="sig" marker-end="url(#arrow)"/><path d="M1010 425H600" class="sig" marker-end="url(#arrow)"/><text x="680" y="448" class="s">I2C / ADC / encoder feedback</text><path d="M805 285V250H460V215" class="fault" marker-end="url(#arrow)"/><text x="470" y="244" class="s">PROTECT_Q gates coil + PWM</text><rect x="35" y="535" width="410" height="150" rx="8" class="box"/><text x="49" y="562" class="h">Hardwired NC loops</text><text x="49" y="587" class="s">24V: S0.A → S1.A → S2.A → START/HOLD → K1 coil → Q1</text><text x="49" y="609" class="s">3V3: independent S0.B, S1.B, S2.B contacts</text><text x="49" y="631" class="s">Each logic NC output has1k pulldown</text><text x="49" y="653" class="s">BAT54 diodes pull CLR_N low when any loop opens</text><rect x="490" y="535" width="390" height="150" rx="8" class="box"/><text x="504" y="562" class="h">Regen energy handling</text><text x="504" y="587" class="s">BUS_SW: bulk2200µF35V +47Ω50W brake</text><text x="504" y="609" class="s">LM393B +TL431A: turn on near27.45V</text><text x="504" y="631" class="s">Q2 logic-level ≥60V MOSFET</text><text x="504" y="653" class="s">Bus software window20–28V; brake untested</text><rect x="925" y="535" width="365" height="150" rx="8" class="box"/><text x="939" y="562" class="h">Host / debug</text><text x="939" y="587" class="s">USB TTL3V3: TX→PA10; RX←PA9;GND</text><text x="939" y="609" class="s">No USB-TTL5V supply connection</text><text x="939" y="631" class="s">SWD: PA13 PA14 NRST VTref GND</text><text x="939" y="653" class="s">Same CRC commands in sim and real hardware</text><text x="35" y="735" class="s">Read wiring.csv + protection_netlist.csv for terminal-level connections. All IC supplies need100nF local decoupling.</text><text x="35" y="760" class="s">No actual voltage/current/thermal/stop-time measurements exist yet. / 电平、力矩、温度和急停响应均待台架实测。</text></svg>