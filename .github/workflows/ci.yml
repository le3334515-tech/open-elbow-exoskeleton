name: Engineering checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software-and-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python and STM32 tools
        run: |
          python -m pip install -e '.[test]'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build native controller and execute C assertions
        run: python firmware/build.py --target host
      - name: Compile STM32 target
        run: python firmware/build.py --target stm32
      - name: Test software, wire protocol and model
        run: python -m pytest tests/test_firmware.py tests/test_protocol.py tests/test_model.py tests/test_integration.py -q --junitxml=artifacts/tests.xml
      - name: Generate model and run shared-controller simulation
        run: |
          python simulation/build_model.py
          python simulation/validate.py --output artifacts/simulation
          python tools/generate_config.py --check
          git diff --exit-code -- simulation/elbow.urdf firmware/include/config_generated.h
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-firmware-evidence
          path: |
            artifacts/
            firmware/build/stm32/open_elbow.elf
            firmware/build/stm32/open_elbow.bin

  mechanical:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[cad]'
      - name: Regenerate parametric design
        run: python mechanical/source/build_cad.py --output artifacts/cad
      - uses: actions/upload-artifact@v4
        with:
          name: generated-mechanical-design
          path: artifacts/cad/

